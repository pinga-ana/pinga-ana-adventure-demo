name: Deploy pygbag to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg vorbis-tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install pygbag pygame-ce

      - name: Write build parameters
        run: |
          python3 -c "
          import json, os
          data = {
              'build_number': int(os.environ.get('GITHUB_RUN_NUMBER', '0')),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'sha': (os.environ.get('GITHUB_SHA', '') or '')[:7],
          }
          with open('build_params.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          print('build_params.json:', data)
          "

      - name: Build web bundle
        run: python -m pygbag --build --template ci/default.tmpl --icon ci/favicon.png .

      - name: Disable Jekyll (wasm-friendly static hosting)
        run: touch build/web/.nojekyll

      - name: Verificar bundle pygbag (index.html obrigatório)
        run: |
          if [ ! -f build/web/index.html ]; then
            echo "::error::pygbag não gerou build/web/index.html — nada para publicar."
            ls -la build/web 2>/dev/null || echo "(pasta build/web inexistente)"
            exit 1
          fi
          echo "Ficheiros em build/web: $(find build/web -type f | wc -l)"

      - name: Resumo do modo de deploy
        env:
          REPO: ${{ vars.USER_SITE_REPO }}
          SITE_PATH: ${{ vars.USER_SITE_PATH }}
        run: |
          if [ -z "${REPO}" ]; then
            echo "::notice::USER_SITE_REPO vazio — deploy só via GitHub Pages deste repositório."
          else
            DEST="${SITE_PATH:-pinga-ana-adventure-demo}"
            echo "::notice::USER_SITE_REPO definido (${REPO}) — push para \`${REPO}/${DEST}/\` (variable opcional USER_SITE_PATH; omissão: pinga-ana-adventure-demo na raiz do site)."
          fi

      - name: Upload Pages artifact (só deploy do próprio repo)
        if: ${{ vars.USER_SITE_REPO == '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: site_branch
        if: ${{ vars.USER_SITE_REPO != '' }}
        env:
          B: ${{ vars.USER_SITE_BRANCH }}
        run: |
          if [ -n "$B" ]; then echo "branch=$B" >> "$GITHUB_OUTPUT"
          else echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Exige secret USER_PAGES_TOKEN
        if: ${{ vars.USER_SITE_REPO != '' }}
        env:
          TOKEN: ${{ secrets.USER_PAGES_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::Define o secret USER_PAGES_TOKEN (PAT com push no repo indicado em USER_SITE_REPO). Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Push para ${{ vars.USER_SITE_REPO }} (subpasta configurável)
        if: ${{ vars.USER_SITE_REPO != '' }}
        env:
          TOKEN: ${{ secrets.USER_PAGES_TOKEN }}
          REPO: ${{ vars.USER_SITE_REPO }}
          BRANCH: ${{ steps.site_branch.outputs.branch }}
          SITE_PATH: ${{ vars.USER_SITE_PATH }}
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          CLONE="${STAGE}/site"
          AUTH="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git clone "${AUTH}" "${CLONE}"
          cd "${CLONE}"
          git checkout "${BRANCH}" 2>/dev/null || git checkout -b "${BRANCH}"
          DEST="${SITE_PATH:-pinga-ana-adventure-demo}"
          # Limpa destino anterior (inclui legado Hugo em static/ se mudaste de layout)
          rm -rf "${DEST}"
          git add -u -- "${DEST}" 2>/dev/null || true
          mkdir -p "${DEST}"
          cp -a "${GITHUB_WORKSPACE}/build/web/." "${DEST}/"
          touch "${DEST}/.nojekyll"
          # README.md aqui faz o Jekyll do site servir markdown em vez do jogo (sem index.html visível)
          rm -f "${DEST}/README.md"
          test -f "${DEST}/index.html" || { echo "::error::Cópia falhou: falta ${DEST}/index.html"; ls -la "${DEST}"; exit 1; }
          echo "::group::Conteúdo a publicar"
          echo "ficheiros: $(find "${DEST}" -type f | wc -l)"
          find "${DEST}" -type f | head -40
          echo "::endgroup::"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # git add --all no repo destino obedece ao .gitignore do site (ex. Jekyll) e omitia .apk/.wasm — -f força a subpasta inteira
          git add -f "${DEST}"
          if [ ! -f .nojekyll ]; then touch .nojekyll; git add -f .nojekyll; fi
          if git diff --staged --quiet; then
            echo "::notice::Sem alterações para comitar."
          else
            git commit -m "deploy pinga-ana-adventure-demo from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            git push "${AUTH}" "${BRANCH}"
          fi

  deploy-project-pages:
    needs: build
    if: ${{ vars.USER_SITE_REPO == '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
